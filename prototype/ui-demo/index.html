<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>THUMUA365 Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
/* Layout: sổ thu mua điện tử — sidebar theo nhóm việc (hằng ngày trên cùng), nội dung bảng + phiếu khổ 80mm, thanh dưới cho điện thoại. Token "Sổ Vựa" của repo frontend. */
:root{
  --paper:#edeae3;--card:#fbf9f5;--sunk:#e4e0d6;--ink:#1a1714;--ink2:#554e44;--ink3:#7d7468;--rule:#d6d0c4;
  --brand:#14663c;--on-brand:#ffffff;--brand-soft:#d6e7da;
  --out:#6d34d0;--recv:#0e6e7a;--pay:#9a3412;--alert:#a81e2e;--on-alert:#ffffff;--warn:#7a5000;
  --alert-soft:#f5dcdc;--warn-soft:#f2e4c0;--recv-soft:#d2e7e9;--out-soft:#e6ddf8;--pay-soft:#f1ded2;
  --demo-bg:#1d2620;--demo-ink:#e8eee9;--demo-ink2:#9fb1a4;--scrim:rgb(20 16 12 / .45);
  --shadow:0 1px 2px rgb(26 23 20 / .06),0 10px 30px rgb(26 23 20 / .10);
  --f-sans:'Be Vietnam Pro',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#14120f;--card:#1f1c18;--sunk:#2a2621;--ink:#f2efe8;--ink2:#cdc6b9;--ink3:#9a9184;--rule:#3a352e;
  --brand:#4bb37d;--on-brand:#0b1a11;--brand-soft:#1c3526;
  --out:#b794f6;--recv:#4fc0cd;--pay:#e08d5c;--alert:#f0788a;--on-alert:#1c0a0d;--warn:#e0b25a;
  --alert-soft:#3b1e23;--warn-soft:#3a2f17;--recv-soft:#15302f;--out-soft:#2b2140;--pay-soft:#3a2418;
  --demo-bg:#0a0c0b;--demo-ink:#e8eee9;--demo-ink2:#8fa093;--scrim:rgb(0 0 0 / .6);
  --shadow:0 1px 2px rgb(0 0 0 / .4),0 10px 30px rgb(0 0 0 / .5);color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#14120f;--card:#1f1c18;--sunk:#2a2621;--ink:#f2efe8;--ink2:#cdc6b9;--ink3:#9a9184;--rule:#3a352e;
  --brand:#4bb37d;--on-brand:#0b1a11;--brand-soft:#1c3526;
  --out:#b794f6;--recv:#4fc0cd;--pay:#e08d5c;--alert:#f0788a;--on-alert:#1c0a0d;--warn:#e0b25a;
  --alert-soft:#3b1e23;--warn-soft:#3a2f17;--recv-soft:#15302f;--out-soft:#2b2140;--pay-soft:#3a2418;
  --demo-bg:#0a0c0b;--demo-ink:#e8eee9;--demo-ink2:#8fa093;--scrim:rgb(0 0 0 / .6);
  --shadow:0 1px 2px rgb(0 0 0 / .4),0 10px 30px rgb(0 0 0 / .5);color-scheme:dark}
/* Ba chế độ xem của app: Trong nhà · Ngoài nắng · Ban đêm (ghi đè theme máy khi người dùng chọn) */
.app[data-mode="day"]{
  --paper:#edeae3;--card:#fbf9f5;--sunk:#e4e0d6;--ink:#1a1714;--ink2:#554e44;--ink3:#7d7468;--rule:#d6d0c4;
  --brand:#14663c;--on-brand:#ffffff;--brand-soft:#d6e7da;
  --out:#6d34d0;--recv:#0e6e7a;--pay:#9a3412;--alert:#a81e2e;--on-alert:#ffffff;--warn:#7a5000;
  --alert-soft:#f5dcdc;--warn-soft:#f2e4c0;--recv-soft:#d2e7e9;--out-soft:#e6ddf8;--pay-soft:#f1ded2;
  --scrim:rgb(20 16 12 / .45);--shadow:0 1px 2px rgb(26 23 20 / .06),0 10px 30px rgb(26 23 20 / .10);color-scheme:light}
.app[data-mode="sun"]{
  --paper:#fffdf7;--card:#ffffff;--sunk:#efeadf;--ink:#000000;--ink2:#2a2520;--ink3:#4d4740;--rule:#a9a396;
  --brand:#0d4f2c;--on-brand:#ffffff;--brand-soft:#cfe3d5;
  --out:#5b21b6;--recv:#0a5560;--pay:#7c2d12;--alert:#8a0f1e;--on-alert:#ffffff;--warn:#5c3c00;
  --alert-soft:#f5d6d6;--warn-soft:#f1e0b5;--recv-soft:#cfe5e8;--out-soft:#e3d8f7;--pay-soft:#f0d9cb;
  --scrim:rgb(0 0 0 / .5);--shadow:0 0 0 1px #a9a396;color-scheme:light;font-size:17px}
.app[data-mode="night"]{
  --paper:#14120f;--card:#1f1c18;--sunk:#2a2621;--ink:#f2efe8;--ink2:#cdc6b9;--ink3:#9a9184;--rule:#3a352e;
  --brand:#4bb37d;--on-brand:#0b1a11;--brand-soft:#1c3526;
  --out:#b794f6;--recv:#4fc0cd;--pay:#e08d5c;--alert:#f0788a;--on-alert:#1c0a0d;--warn:#e0b25a;
  --alert-soft:#3b1e23;--warn-soft:#3a2f17;--recv-soft:#15302f;--out-soft:#2b2140;--pay-soft:#3a2418;
  --scrim:rgb(0 0 0 / .6);--shadow:0 1px 2px rgb(0 0 0 / .4),0 10px 30px rgb(0 0 0 / .5);color-scheme:dark}

html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-sans)}
.app{min-height:100%;background:var(--paper);color:var(--ink);font-family:var(--f-sans);font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent}
.app *{box-sizing:border-box}
.app h1,.app h2,.app h3{margin:0;text-wrap:balance;letter-spacing:-.01em}
.app p{margin:0}
.mono{font-family:var(--f-mono)}
.tnum,.num{font-variant-numeric:tabular-nums}
.muted{color:var(--ink3)}
.ic{flex:none}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

/* Demo bar */
.demobar{display:flex;align-items:center;gap:8px 14px;flex-wrap:wrap;padding:8px 16px;background:var(--demo-bg);color:var(--demo-ink);font-size:13px}
.dtag{font-family:var(--f-mono);font-size:11px;font-weight:700;letter-spacing:.1em;padding:3px 8px;border-radius:6px;background:#2f7a50;color:#fff}
.demobar label{display:flex;align-items:center;gap:8px;color:var(--demo-ink2)}
.demobar select{font:inherit;color:var(--demo-ink);background:rgb(255 255 255 / .08);border:1px solid rgb(255 255 255 / .16);border-radius:8px;padding:4px 8px;max-width:240px;color-scheme:dark}
.dbtn{font:inherit;color:var(--demo-ink);background:rgb(255 255 255 / .08);border:1px solid rgb(255 255 255 / .16);border-radius:8px;padding:4px 10px;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.dbtn:hover{background:rgb(255 255 255 / .14)}
.dbtn.off{background:#7a2230;border-color:#b23a4c}
.dbtn .dot{width:8px;height:8px;border-radius:50%;background:#53d18a}
.dbtn.off .dot{background:#ff9aa8}
.dspacer{flex:1}

/* Shell */
.shell{display:grid;grid-template-columns:256px minmax(0,1fr);align-items:start}
.side{position:sticky;top:0;height:100dvh;overflow:auto;border-right:1px solid var(--rule);background:var(--card);padding:16px 12px;display:flex;flex-direction:column;gap:14px}
.brand{display:flex;align-items:center;gap:10px;padding:2px 6px}
.mark{width:34px;height:34px;border-radius:9px;background:var(--brand);color:var(--on-brand);display:grid;place-items:center}
.word{font-weight:800;letter-spacing:.02em;font-size:16px}
.word small{display:block;font-weight:500;font-size:11px;color:var(--ink3);letter-spacing:.02em}
.orgcard{border:1px solid var(--rule);border-radius:12px;padding:10px 12px;display:grid;gap:4px;background:var(--paper)}
.orgcard b{font-size:.95em;line-height:1.3}
.orgcard .meta{font-size:.8em;color:var(--ink3);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.navg{display:grid;gap:2px}
.navg>span{font-size:11px;font-weight:600;color:var(--ink3);text-transform:uppercase;letter-spacing:.08em;padding:6px 10px 4px}
.navi{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:9px;color:var(--ink2);text-decoration:none;font-weight:500;cursor:pointer;border:0;background:none;font:inherit;text-align:left;width:100%}
.navi:hover{background:var(--sunk);color:var(--ink)}
.navi[aria-current="page"]{background:var(--brand-soft);color:var(--brand);font-weight:600}
.navi .cnt{margin-left:auto;font-size:11px;font-weight:700;min-width:20px;height:20px;border-radius:10px;display:grid;place-items:center;padding:0 6px;background:var(--alert);color:var(--on-alert)}
.side-foot{margin-top:auto;font-size:12px;color:var(--ink3);padding:8px 10px;border-top:1px solid var(--rule)}

.main{min-width:0}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);border-bottom:1px solid var(--rule);display:flex;align-items:center;gap:10px;padding:10px 24px;min-height:60px}
.top .ttl{min-width:0;flex:1}
.top h1{font-size:1.2em;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .sub{font-size:.8em;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.searchbtn{display:flex;align-items:center;gap:8px;border:1px solid var(--rule);background:var(--card);color:var(--ink3);border-radius:10px;padding:0 10px;height:2.5em;font:inherit;font-size:.9em;cursor:pointer;min-width:220px}
.searchbtn kbd{margin-left:auto;font-family:var(--f-mono);font-size:11px;border:1px solid var(--rule);border-radius:5px;padding:0 5px}
.syncpill{display:inline-flex;align-items:center;gap:6px;font-size:.8em;font-weight:600;padding:5px 10px;border-radius:999px;background:var(--brand-soft);color:var(--brand);white-space:nowrap;border:0;font-family:inherit;cursor:pointer}
.syncpill.pending{background:var(--warn-soft);color:var(--warn)}
.syncpill.off{background:var(--alert-soft);color:var(--alert)}
.iconbtn{width:2.6em;height:2.6em;border-radius:10px;display:grid;place-items:center;background:transparent;border:1px solid transparent;color:var(--ink2);cursor:pointer;position:relative;font:inherit;flex:none}
.iconbtn:hover{background:var(--sunk)}
.iconbtn .badge{position:absolute;top:3px;right:3px;min-width:17px;height:17px;border-radius:9px;background:var(--alert);color:var(--on-alert);font-size:10px;font-weight:700;display:grid;place-items:center;padding:0 4px}
.avatar{width:2.4em;height:2.4em;border-radius:50%;background:var(--brand);color:var(--on-brand);display:grid;place-items:center;font-weight:700;font-size:.85em;border:0;cursor:pointer;flex:none;font-family:inherit}
.menu{position:absolute;right:16px;top:58px;z-index:40;width:280px;background:var(--card);border:1px solid var(--rule);border-radius:14px;box-shadow:var(--shadow);padding:8px;display:grid;gap:2px}
.menu .who{padding:8px 10px 10px;border-bottom:1px solid var(--rule);margin-bottom:4px}

.content{padding:24px;max-width:1280px;margin:0 auto;display:grid;gap:20px}
.pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.pagehead h2{font-size:1.45em;font-weight:700}
.pagehead p{color:var(--ink3);font-size:.9em;max-width:65ch}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.foot-note{font-size:12px;color:var(--ink3);text-align:center;padding:8px 0 4px}

/* Bottom bar (phone) */
.bottombar{display:none;position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--rule);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));grid-template-columns:repeat(5,1fr);align-items:end}
.bb{display:grid;justify-items:center;gap:2px;font:inherit;font-size:11px;font-weight:600;color:var(--ink3);background:none;border:0;padding:4px 0;cursor:pointer;position:relative}
.bb[aria-current="page"]{color:var(--brand)}
.bb .cnt{position:absolute;top:0;left:calc(50% + 6px);min-width:16px;height:16px;border-radius:8px;background:var(--alert);color:var(--on-alert);font-size:10px;display:grid;place-items:center;padding:0 4px}
.fab{width:52px;height:52px;border-radius:16px;background:var(--brand);color:var(--on-brand);display:grid;place-items:center;margin:-22px auto 0;border:4px solid var(--paper);cursor:pointer}

@media (max-width:899px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .side{display:none}
  .bottombar{display:grid}
  .content{padding:16px 16px 104px}
  .top{padding:8px 16px}
  .searchbtn{min-width:0;width:2.6em;padding:0;justify-content:center}
  .searchbtn span,.searchbtn kbd{display:none}
  .syncpill .lbl{display:none}
  .menu{right:8px;left:8px;width:auto}
}

/* Controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:2.6em;padding:0 1em;border-radius:10px;border:1px solid var(--rule);background:var(--card);color:var(--ink);font:inherit;font-weight:600;font-size:.92em;cursor:pointer;white-space:nowrap;text-decoration:none}
.btn:hover{border-color:var(--ink3)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--alert);border-color:var(--alert)}
.btn.danger.solid{background:var(--alert);color:var(--on-alert)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--sunk)}
.btn.sm{min-height:2.15em;padding:0 .75em;font-size:.84em;border-radius:8px}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed;filter:none}
.link{background:none;border:0;padding:0;font:inherit;color:var(--brand);font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:3px}

.card{background:var(--card);border:1px solid var(--rule);border-radius:14px;min-width:0}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px;border-bottom:1px solid var(--rule);flex-wrap:wrap}
.card-h h3{font-size:1em;font-weight:700}
.card-h .muted{font-size:.85em}
.card-b{padding:16px 18px}
.card-b.tight{padding:0}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.split{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px;align-items:start}
.stack{display:grid;gap:16px;align-content:start}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{display:flex;justify-content:space-between;align-items:center;gap:12px}
@media (max-width:1000px){.split,.g3{grid-template-columns:minmax(0,1fr)}}
@media (max-width:700px){.g2{grid-template-columns:minmax(0,1fr)}}

.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:1100px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{padding:14px 16px;display:grid;gap:2px}
.kpi .l{font-size:.8em;color:var(--ink3);font-weight:500}
.kpi .v{font-size:1.45em;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.01em;line-height:1.25}
.kpi .d{font-size:.78em;color:var(--ink3)}
.kpi.hero{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.kpi.hero .l,.kpi.hero .d{color:var(--on-brand);opacity:.85}

.table-wrap{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:.9em}
.t th{text-align:left;font-weight:600;color:var(--ink3);font-size:.75em;text-transform:uppercase;letter-spacing:.06em;padding:10px 14px;border-bottom:1px solid var(--rule);white-space:nowrap;background:var(--card)}
.t td{padding:10px 14px;border-bottom:1px solid var(--rule);vertical-align:middle}
.t tbody tr:last-child td{border-bottom:0}
.t tr.click{cursor:pointer}
.t tr.click:hover td{background:var(--sunk)}
.t .num{text-align:right;white-space:nowrap}
.t tfoot td{font-weight:700;border-top:1px solid var(--rule);border-bottom:0}
.t .neg{color:var(--alert);font-weight:700}
.cellname{display:grid;line-height:1.3}
.cellname small{color:var(--ink3);font-size:.85em}
@media (max-width:640px){.hide-sm{display:none}}
@media (max-width:1100px){.hide-md{display:none}}

.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:999px;font-size:.76em;font-weight:600;white-space:nowrap;background:var(--sunk);color:var(--ink2);line-height:1.6}
.pill::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.pill.ok{background:var(--brand-soft);color:var(--brand)}
.pill.info{background:var(--recv-soft);color:var(--recv)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.alert{background:var(--alert-soft);color:var(--alert)}
.pill.out{background:var(--out-soft);color:var(--out)}
.pill.pay{background:var(--pay-soft);color:var(--pay)}
.pill.plain::before{display:none}
.kind-in{color:var(--brand);font-weight:700}
.kind-out{color:var(--out);font-weight:700}
.amt-pay{color:var(--pay);font-weight:700}
.amt-recv{color:var(--recv);font-weight:700}

.field{display:grid;gap:6px;min-width:0}
.field>label,.lbl{font-weight:600;font-size:.86em}
.hint{font-size:.8em;color:var(--ink3)}
.err{font-size:.82em;color:var(--alert);font-weight:600}
.input{width:100%;min-height:2.7em;padding:.5em .8em;border:1px solid var(--rule);border-radius:10px;background:var(--card);color:var(--ink);font:inherit}
textarea.input{min-height:5.5em;resize:vertical}
.input:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.input.bad{border-color:var(--alert)}
.input.r{text-align:right;font-variant-numeric:tabular-nums}
.input[readonly]{background:var(--sunk)}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.check{display:flex;gap:10px;align-items:flex-start;font-size:.9em}
.check input{width:18px;height:18px;margin-top:2px;accent-color:var(--brand)}

.seg{display:inline-flex;background:var(--sunk);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:.38em .85em;border-radius:8px;font:inherit;font-size:.86em;font-weight:600;color:var(--ink2);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0 / .12)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--rule);overflow-x:auto}
.tabs button{border:0;background:none;padding:.7em .9em;font:inherit;font-weight:600;color:var(--ink3);border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--ink);border-color:var(--brand)}
.tabs .c{font-size:.8em;background:var(--sunk);border-radius:8px;padding:0 6px;margin-left:4px;color:var(--ink2)}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px 18px;border-bottom:1px solid var(--rule)}
.toolbar .input{max-width:260px;min-height:2.3em}

.banner{display:flex;gap:12px;align-items:center;padding:10px 14px;border-radius:12px;font-size:.9em;border:1px solid transparent;flex-wrap:wrap}
.banner b{font-weight:700}
.banner .grow{flex:1;min-width:200px}
.banner.info{background:var(--recv-soft);color:var(--ink)}
.banner.warn{background:var(--warn-soft);color:var(--ink)}
.banner.alert{background:var(--alert-soft);color:var(--ink)}
.banner.ok{background:var(--brand-soft);color:var(--ink)}
.banner .ic{color:var(--ink2)}

.todo{display:grid}
.todo button{display:flex;gap:12px;align-items:center;padding:12px 18px;border:0;border-bottom:1px solid var(--rule);background:none;font:inherit;color:var(--ink);text-align:left;cursor:pointer}
.todo button:last-child{border-bottom:0}
.todo button:hover{background:var(--sunk)}
.todo .n{font-size:1.25em;font-weight:800;min-width:2.2em;font-variant-numeric:tabular-nums}
.todo .n.alert{color:var(--alert)}
.todo .n.warn{color:var(--warn)}
.todo .n.ok{color:var(--brand)}
.todo .txt{flex:1}

.empty{padding:36px 18px;text-align:center;color:var(--ink3);display:grid;gap:8px;justify-items:center}
.empty b{color:var(--ink);font-size:1.05em}

/* Overlay */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:60;display:flex;align-items:center;justify-content:center;padding:16px;animation:fade .15s ease}
.scrim.drawer-s{justify-content:flex-end;align-items:stretch;padding:0}
.dialog{background:var(--card);color:var(--ink);border-radius:16px;width:min(520px,100%);max-height:calc(100dvh - 32px);overflow:auto;box-shadow:var(--shadow);display:flex;flex-direction:column;animation:pop .18s ease}
.dialog.wide{width:min(780px,100%)}
.dialog.drawer{width:min(500px,100%);max-height:none;height:100dvh;border-radius:0;animation:slide .2s ease}
.dlg-h{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--rule);position:sticky;top:0;background:var(--card);z-index:2}
.dlg-h h3{font-size:1.05em}
.dlg-b{padding:18px;display:grid;gap:14px;flex:1;align-content:start}
.dlg-f{display:flex;justify-content:flex-end;gap:10px;padding:12px 18px;border-top:1px solid var(--rule);position:sticky;bottom:0;background:var(--card);flex-wrap:wrap}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{transform:translateY(8px);opacity:0}}
@keyframes slide{from{transform:translateX(24px);opacity:.4}}
@media (max-width:640px){
  .scrim,.scrim.drawer-s{align-items:flex-end;padding:0;justify-content:center}
  .dialog,.dialog.wide,.dialog.drawer{width:100%;border-radius:18px 18px 0 0;max-height:92dvh;height:auto;padding-bottom:env(safe-area-inset-bottom,0px)}
}
.toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:24px;z-index:80;display:grid;gap:8px;width:min(440px,calc(100% - 32px))}
@media (max-width:899px){.toasts{bottom:92px}}
.toast{background:var(--ink);color:var(--paper);padding:11px 14px;border-radius:12px;font-size:.9em;font-weight:500;box-shadow:var(--shadow);display:flex;gap:10px;align-items:center;animation:pop .2s ease}
.toast.alert{background:var(--alert);color:var(--on-alert)}

/* Phiếu khổ 80mm */
.voucher{max-width:380px;width:100%;margin:0 auto;background:var(--card);border:1px solid var(--rule);border-radius:6px;padding:20px 18px 22px;font-size:.88em;display:grid;gap:8px;box-shadow:var(--shadow)}
.v-org{text-align:center;font-weight:800;font-size:1.1em;line-height:1.3}
.v-addr{text-align:center;color:var(--ink3);font-size:.85em}
.v-title{text-align:center;font-weight:800;letter-spacing:.14em;font-size:.95em;margin-top:6px}
.v-meta{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.v-hr{border:0;border-top:1px dashed var(--ink3);margin:4px 0}
.v-line{display:grid;gap:2px}
.v-line .p{font-weight:700}
.v-line .d{color:var(--ink2);font-size:.92em}
.v-line .m{display:flex;justify-content:space-between;gap:8px;font-variant-numeric:tabular-nums}
.v-sum{display:flex;justify-content:space-between;gap:8px;font-variant-numeric:tabular-nums}
.v-total{font-size:1.25em;font-weight:800}
.v-words{font-style:italic;color:var(--ink2);font-size:.9em}
.v-thanks{text-align:center;color:var(--ink3);font-size:.85em;margin-top:6px}

/* Tạo phiếu */
.create{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}
.create .sum{position:sticky;top:76px}
@media (max-width:1100px){.create{grid-template-columns:minmax(0,1fr)}.create .sum{position:static}}
.line{border:1px solid var(--rule);border-radius:12px;padding:14px;display:grid;gap:12px;background:var(--paper)}
.line-res{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:.9em;padding-top:10px;border-top:1px dashed var(--rule)}
.line-res b{font-variant-numeric:tabular-nums}
.sumrow{display:flex;justify-content:space-between;gap:12px;padding:6px 0;font-variant-numeric:tabular-nums}
.sumrow.big{font-size:1.3em;font-weight:800;border-top:1px solid var(--rule);padding-top:10px;margin-top:4px}
.photos{display:flex;gap:10px;flex-wrap:wrap}
.ph{width:84px;height:84px;border-radius:10px;background:repeating-linear-gradient(135deg,var(--sunk) 0 8px,var(--paper) 8px 16px);border:1px solid var(--rule);display:grid;place-items:center;color:var(--ink3);font-size:11px;position:relative}
.ph button{position:absolute;top:2px;right:2px}
.addph{border:1.5px dashed var(--ink3);background:none;cursor:pointer;font:inherit;color:var(--ink2)}
.quota{display:grid;gap:12px;justify-items:center;text-align:center;padding:40px 20px}

/* Timeline đơn */
.tl{list-style:none;margin:0;padding:0;display:grid;gap:0}
.tl li{display:grid;grid-template-columns:18px 1fr;gap:10px;padding-bottom:14px;position:relative}
.tl li::before{content:'';position:absolute;left:8px;top:16px;bottom:0;width:2px;background:var(--rule)}
.tl li:last-child::before{display:none}
.tl .dot{width:12px;height:12px;border-radius:50%;background:var(--brand);margin-top:5px;margin-left:3px;box-shadow:0 0 0 3px var(--brand-soft)}
.tl .dot.me{background:var(--recv);box-shadow:0 0 0 3px var(--recv-soft)}
.tl small{color:var(--ink3)}

.ocard{display:grid;gap:8px;padding:14px 16px;border-bottom:1px solid var(--rule);cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;text-align:left;font:inherit;color:inherit;width:100%}
.ocard:hover{background:var(--sunk)}
.ocard:last-child{border-bottom:0}
.ocard .top2{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}

.codebox{display:grid;gap:6px;justify-items:center;padding:18px;border-radius:14px;background:var(--paper);border:1px dashed var(--ink3);text-align:center}
.code{font-family:var(--f-mono);font-size:2em;letter-spacing:.14em;font-weight:700;line-height:1.2}
.codein{font-family:var(--f-mono);font-size:1.3em;letter-spacing:.12em;text-transform:uppercase;text-align:center}
.qr{width:200px;height:200px;background:#ffffff;border-radius:10px;padding:10px;image-rendering:pixelated}

.bars{display:grid;gap:10px}
.bar{display:grid;grid-template-columns:150px minmax(0,1fr) 70px;gap:10px;align-items:center;font-size:.88em}
.bar .track{height:10px;background:var(--sunk);border-radius:6px;overflow:hidden}
.bar .fill{height:100%;background:var(--brand);border-radius:6px}
@media (max-width:640px){.bar{grid-template-columns:100px minmax(0,1fr) 54px}}
.meter{height:8px;background:var(--sunk);border-radius:6px;overflow:hidden}
.meter>i{display:block;height:100%;background:var(--brand)}
.meter.warn>i{background:var(--warn)}

.matrix td,.matrix th{text-align:center}
.matrix td:first-child,.matrix th:first-child{text-align:left}
.matrix .me{background:var(--brand-soft)}
.yes{color:var(--brand);font-weight:800}
.no{color:var(--ink3)}

.palette{width:min(620px,100%);align-self:flex-start;margin-top:10vh}
.palette .input{border:0;border-bottom:1px solid var(--rule);border-radius:0;min-height:3.4em;font-size:1.05em;box-shadow:none}
.pl{max-height:50vh;overflow:auto;padding:6px}
.pl button{display:flex;gap:12px;align-items:center;width:100%;padding:9px 12px;border-radius:9px;border:0;background:none;font:inherit;color:var(--ink);cursor:pointer;text-align:left}
.pl button[aria-selected="true"],.pl button:hover{background:var(--sunk)}
.pl small{margin-left:auto;color:var(--ink3);font-size:.8em}
.pl .grp{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink3);padding:8px 12px 4px;font-weight:600}

.ntf{display:flex;gap:12px;padding:12px 18px;border-bottom:1px solid var(--rule);cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left;font:inherit;color:inherit}
.ntf:hover{background:var(--sunk)}
.ntf .nd{width:8px;height:8px;border-radius:50%;background:var(--alert);margin-top:8px;flex:none}
.ntf.read .nd{background:transparent}
.ntf.read b{font-weight:500}
.ntf .ib{width:34px;height:34px;border-radius:10px;background:var(--sunk);display:grid;place-items:center;color:var(--ink2);flex:none}

/* Auth */
.auth{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);min-height:calc(100dvh - 44px)}
.auth-l{background:var(--brand);color:var(--on-brand);padding:48px;display:flex;flex-direction:column;gap:24px;justify-content:center}
.auth-l h1{font-size:2.1em;font-weight:800;line-height:1.15;max-width:18ch}
.auth-l p{opacity:.88;max-width:46ch}
.auth-l ul{list-style:none;padding:0;margin:0;display:grid;gap:12px}
.auth-l li{display:flex;gap:12px;align-items:flex-start}
.auth-r{display:grid;place-items:center;padding:32px 16px}
.authcard{width:min(420px,100%);display:grid;gap:16px}
.who{display:grid;gap:10px}
.whoopt{display:flex;gap:14px;align-items:center;padding:14px 16px;border:1.5px solid var(--rule);border-radius:14px;background:var(--card);cursor:pointer;text-align:left;font:inherit;color:var(--ink)}
.whoopt[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-soft)}
.whoopt .ib{width:42px;height:42px;border-radius:12px;background:var(--sunk);display:grid;place-items:center;flex:none}
@media (max-width:899px){.auth{grid-template-columns:minmax(0,1fr)}.auth-l{padding:28px 16px}.auth-l h1{font-size:1.6em}}

.spark{width:100%;height:auto;display:block}
.chart text{fill:var(--ink3);font-size:11px;font-family:var(--f-sans)}
.chart .grid{stroke:var(--rule);stroke-width:1}
.chart .b{fill:var(--brand);opacity:.38}
.chart .b.now{opacity:1}
.chart .lbl-now{fill:var(--ink);font-weight:700}
.morelist{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.morelist button{display:grid;gap:10px;padding:16px;border-radius:14px;border:1px solid var(--rule);background:var(--card);font:inherit;color:var(--ink);font-weight:600;text-align:left;cursor:pointer}
.morelist button:hover{border-color:var(--ink3)}
.spin{width:16px;height:16px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:rot .8s linear infinite;display:inline-block}
@keyframes rot{to{transform:rotate(360deg)}}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:.9em}
.kv dt{color:var(--ink3)}
.kv dd{margin:0;font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<div class="app" id="app"><div id="root"></div><div id="overlay"></div><div class="toasts" id="toasts" aria-live="polite"></div></div>
<script src="core.js"></script>
<script src="data.js"></script>
<script src="ui.js"></script>
<script src="views-book.js"></script>
<script src="views-more.js"></script>
<script src="views-org.js"></script>
<script src="app.js"></script>
</body>
</html>
